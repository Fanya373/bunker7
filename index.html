.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.tr{display:flex;gap:10px;align-items:center;padding:4px 0;border-top:1px dashed var(--bd);flex-wrap:wrap}
.tr:first-of-type{border-top:0}
.k{flex:0 0 112px;color:var(--mu);font-size:14px}
.v{flex:1;min-width:120px}
.hid{color:var(--mu);font-style:italic}
button,input,select{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:8px 12px;background:var(--sf);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:3px 10px;font-size:14px}
button.alt{background:transparent;color:var(--ac)}
button.on{background:var(--bad);border-color:var(--bad)}
input{width:100%}
select{max-width:100%}
#err{color:var(--bad);margin:8px 0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.code{font-size:30px;letter-spacing:4px;font-weight:700}
.link{word-break:break-all;user-select:all;font-size:14px}
ul{padding-left:20px;margin:6px 0}
</style>

function hCount(){

function hgt(){

const ADULT=/порно|шлюх|ночная бабочка|онлифанс|дроч|пятки|куколд|извращен|нимфоман|озабочен|милф|некрофил|оргию|бабник|секс|дилдо|вибратор|презерватив|виагра|афродизиак|вагин|голая|сиськ|booty|thick|член|яйц|яичек|импотент|пизд|жопе|гениталий|половой акт|очко|смазк|манга (яой|юри)|big bob|трусы|синс|штурвал|алкоголик|водк|пива|амфетамин|героин|марихуан|варил мет|бесплоди/i;

const MINOR_OR="Не применимо (ещё ребёнок)";
const okf=c=>l=>c.a<18?l.filter(x=>!ADULT.test(x)):l;
function raceRange(c){
  const rt=SP.find(x=>x[0]===c.race)||[];
  let lo=5,hi=200;
  if(rt[2]){lo=rt[2];hi=rt[3]}
  if(ADULT.test(c.race))lo=Math.max(lo,18);

function genAge(c){
  const{rt,lo,hi}=raceRange(c),gr=Math.random();
  c.g=gr<.15?"n":rt[1]?"f":gr<.575?"m":"f";
  c.a=lo+Math.floor(Math.random()*(hi-lo+1));
  c.fi=(c.g==="f"&&c.a>45&&c.a<=200)||Math.random()<.3}
function fmtAge(c){
  const f=c.g==="f";
  return(c.g==="n"?"Бесполый":f?"Женский":"Мужской")+", "+c.a.toLocaleString("ru-RU")+" "+yw(c.a)+(c.a<18?"":", "+(c.g==="n"?"не может иметь детей":c.fi?(f?"бесплодна":"бесплоден"):"может иметь детей"))}
function rollOrient(c){
  if(c.a<18)return MINOR_OR;
  if(c.g==="n")return rnd(OV.n);
  const f=c.g==="f",r=Math.random();
  return r<.6?"Гетеро":r<.73?(f?"Лесбиянка":"Гей"):r<.86?(f?"Бисексуалка":"Бисексуал"):(f?"Фанатка яой":"Фанат Джоджо")}
function rollHealth(c){
  const n=hCount();
  let pool=okf(c)(D.health.concat(c.g==="f"?HF:c.g==="m"?HM:[]));
  if(n>1)pool=pool.filter(x=>x!=="Полностью здоров"&&x!=="Железное здоровье");
  return pickN(pool,n).join(", ")}
const fixItem=x=>x==="Гантели"?"Гантели "+(1+Math.floor(Math.random()*50))+" кг":x;
function rollPack(c){

function rollBig(c){return pickN(okf(c)(D.big),Math.random()<.4?2:1).join(", ")}
function rollKey(c,k){
  if(k==="race")c.race=rnd(SP)[0];
  else if(k==="age")genAge(c);
  else if(k==="orient")c.orient=rollOrient(c);
  else if(k==="health")c.health=rollHealth(c);
  else if(k==="pack")c.pack=rollPack(c);
  else if(k==="big")c.big=rollBig(c);
  else if(k==="build")c.build=rnd(D.build)+", рост "+hgt();
  else c[k]=rnd(okf(c)(D[k]))}
function norm(c){
  const{rt,lo,hi}=raceRange(c);
  if(rt[1]&&c.g==="m")c.g="f";
  if(c.a<lo||c.a>hi){c.a=lo+Math.floor(Math.random()*(hi-lo+1));c.fi=(c.g==="f"&&c.a>45&&c.a<=200)||Math.random()<.3}
  c.age=fmtAge(c);
  if(c.a<18){
    c.orient=MINOR_OR;
    ["prof","trait","hobby","phobia","fact","health","pack","big"].forEach(k=>{if(ADULT.test(c[k]))rollKey(c,k)});

function deal(){

function nbrs(s){
  const al=H.alive,i=al.indexOf(s);

function spLog(s,ab,t,k){

const addTo=(c,k,item)=>{c[k]=/^Пусто/.test(c[k])?item:c[k]+", "+item};
function spRun(s,a,prep){
  const p=H.players[s];
  if(!p||!a||typeof a!=="object"||!H.alive.includes(s)||(H.phase!=="reveal"&&H.phase!=="vote")||p.pend)return;
  p.note="";
  const slot=a.slot===1?1:0,ab=AB.find(x=>x.id===(p.sp||[])[slot]);

  let t=s;
  if(ab.tg!=="self"){
    t=a.target;
    if(!H.alive.includes(t)||!H.players[t].card)return;
    if(ab.tg==="other"&&t===s)return;
    if(ab.tg==="nb"&&!nbrs(s).includes(t))return;
  }
  const k=a.key;

    const cands=[],seen=new Set([tc[k]]);
    for(let i=0;i<60&&cands.length<3;i++){
      const c=JSON.parse(JSON.stringify(tc));
      rollKey(c,k);norm(c);
      if(!seen.has(c[k])){seen.add(c[k]);cands.push(c)}
    }
    if(!cands.length){p.note="Для этой характеристики нет других вариантов. Выберите другую.";return}

function tally(){

  if(!el.length)return null;
  const c={};el.forEach(i=>c[i]=0);
  H.alive.forEach(v=>{const t=H.votes[v];if(t&&t!==v&&c[t]!==undefined)c[t]++});
  const mx=Math.max(...Object.values(c));
  const top=el.filter(i=>c[i]===mx);
  return{out:rnd(top),mx,tie:top.length>1};
}

function genCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function createRoom(name){
  isHost=true;
  H={phase:"lobby",round:0,spots:0,alive:[],out:[],log:[],votes:{},players:{host:{name,card:null,rev:{}}},order:["host"]};
  tryPeer(0);
}
function tryPeer(n){
  code=genCode();
  const p=new Peer("bunker-"+code);peer=p;
  p.on("open",()=>{V=view("host");render()});
  p.on("error",e=>{
    if(e.type==="unavailable-id"&&n<5){p.destroy();tryPeer(n+1)}
    else{msg("Ошибка связи: "+e.type+". Обновите страницу.")}
  });
  p.on("connection",c=>{c.on("data",m=>onMsg(c,m));c.on("close",()=>onClose(c))});
}
function joinRoom(name,c){
  isHost=false;code=c;
  const p=new Peer();peer=p;
  p.on("open",()=>{
    conn=p.connect("bunker-"+code,{reliable:true});
    conn.on("open",()=>conn.send({t:"join",sid:mySid(),name}));
    conn.on("data",m=>{if(m&&m.t==="v"){msg("");V=m.v;render()}});
    conn.on("close",()=>msg("Связь с ведущим потеряна. Обновите страницу и войдите с тем же именем и кодом."));
  });
  p.on("error",e=>{
    msg(e.type==="peer-unavailable"?"Комната с таким кодом не найдена.":"Ошибка связи: "+e.type);
    if(e.type==="peer-unavailable"){$("#start").hidden=false;peer=null}
  });
}
function send(t,arg){
  if(isHost)step(t,"host",arg);
  else if(conn&&conn.open)conn.send({t,arg});
  else msg("Нет связи с ведущим.");
}

function spForm(ab){
  let h='<div class="row">';
  if(ab.need==="key")h+='<select data-ui="key">'+KEYS.map(k=>'<option value="'+k+'"'+(UI.key===k?' selected':'')+'>'+esc(TR[k])+'</option>').join("")+'</select>';
  if(ab.tg!=="self"){
    const o=tgOpts(ab),sel=o.some(x=>x.id===UI.target)?UI.target:(o[0]&&o[0].id);
    h+='<select data-ui="target">'+o.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>').join("")+'</select>';
  }
  return h+'<button class="sm" type="button" data-act="spgo">'+(ab.pend?'Показать варианты':'Применить')+'</button><button class="sm alt" type="button" data-act="spclose">Отмена</button></div>'}
function spHtml(){
  const me=V.players.find(p=>p.id===V.me);
  if(!me||me.st!=="in"||(V.phase!=="reveal"&&V.phase!=="vote")||!V.sp||!V.sp.length)return"";
  let h='<h2>Спецвозможности</h2><div class="mu">Каждая используется один раз, в любой момент, и не считается раскрытием характеристики.</div>';
  if(V.note)h+='<div style="color:var(--bad);margin:6px 0">'+esc(V.note)+'</div>';
  if(V.pend)h+='<div class="card me"><b>'+esc(V.pend.n)+': выберите вариант</b><div class="mu">'+esc(TR[V.pend.k])+' — '+esc(V.pend.tname)+'</div>'+V.pend.c.map((t,i)=>'<div class="tr"><span class="v">'+esc(t)+'</span><button class="sm" type="button" data-act="pick" data-id="'+i+'">Выбрать</button></div>').join("")+'<div class="row"><button class="alt" type="button" data-act="pcancel">Отмена</button></div></div>';
  V.sp.forEach((x,i)=>{
    const ab=AB.find(y=>y.id===x.id);
    h+='<div class="card"><div class="hd"><b>'+esc(x.n)+'</b>'+(x.used?'<span class="badge">использовано</span>':'')+'</div><div class="mu">'+esc(x.d)+'</div>';
    if(!x.used&&!V.pend)h+=UI.slot===i?spForm(ab):'<div class="row"><button class="sm" type="button" data-act="spopen" data-id="'+i+'">Использовать</button></div>';
    h+='</div>';
  });
  if(V.spy&&V.spy.length)h+='<div class="card"><b>Что вы узнали (видите только вы)</b><ul>'+V.spy.map(x=>'<li>'+esc(x.name)+' — '+esc(x.k)+': '+esc(x.v)+'</li>').join("")+'</ul></div>';
  return h}
function spGo(){
  const x=V.sp&&V.sp[UI.slot],ab=x&&AB.find(y=>y.id===x.id);
  if(!ab)return;
  const o=tgOpts(ab),target=ab.tg==="self"?V.me:(o.some(z=>z.id===UI.target)?UI.target:(o[0]&&o[0].id));
  if(ab.tg!=="self"&&!target){msg("Нет подходящей цели");return}
  msg("");
  send(ab.pend?"spprep":"spuse",{slot:UI.slot,key:UI.key,target});
  UI.slot=-1}
function rows(p){
  if(!p.vals)return '<p class="mu">Карточка не выдана</p>';
  const full=p.st==="out"||V.phase==="over";
  return KEYS.map(k=>{
    const val=p.vals[k],rv=p.rv&&p.rv[k]!==undefined;
    let v;
    if(val===undefined)v='<span class="v hid">скрыто</span>';
    else if(rv||full)v='<span class="v">'+esc(val)+'</span>';
    else v='<span class="v hid">'+esc(val)+' (видите только вы)</span>'+(V.canRev?'<button class="sm" type="button" data-act="reveal" data-id="'+k+'">Раскрыть</button>':'');
    return '<div class="tr"><span class="k">'+TR[k]+'</span>'+v+'</div>';
  }).join("");
}
function bunkerHtml(b){
  const L={where:"Где находится",built:"Как построен",size:"Размер",broken:"Поломки",inside:"Что внутри",items:"Предметы"};
  if(!b||typeof b!=="object")return "";
  return '<div class="card"><b>Бункер: '+esc(b.name)+'</b>'+Object.keys(L).map(k=>'<div class="tr"><span class="k">'+L[k]+'</span><span class="v">'+esc(b[k])+'</span></div>').join("")+'</div>';
}
function render(){
  const m=$("#main");
  $("#start").hidden=!!peer;
  if(!V){m.innerHTML=peer?'<p class="mu">Подключаюсь…</p>':"";return}
  const host=V.me==="host",ph=V.phase,me=V.players.find(p=>p.id===V.me);
  if(ph==="lobby"){
    const link=location.href.split("#")[0]+"#"+V.code;
    m.innerHTML='<h2>Лобби</h2>'+
      '<div class="card"><div class="mu">Код комнаты</div><div class="code">'+esc(V.code)+'</div>'+
      (host?'<div class="mu" style="margin-top:6px">Ссылка для друзей:</div><div class="link">'+esc(link)+'</div>':'')+'</div>'+
      '<div class="card"><b>Игроки ('+V.players.length+')</b><ul>'+V.players.map(p=>'<li>'+esc(p.name)+(p.id==="host"?' — ведущий':'')+(p.id===V.me?' (вы)':'')+'</li>').join("")+'</ul></div>'+
      (host?'<button type="button" data-act="start">Начать игру</button><p class="mu">Не закрывайте эту вкладку и не давайте экрану гаснуть: комната живёт, пока она открыта у ведущего.</p>':'<p class="mu">Ждём, пока ведущий начнёт игру.</p>');
    return;
  }
  const inGame=me&&me.st==="in";
  const label={reveal:"Раскрытие и обсуждение",vote:"Голосование",over:"Игра окончена"}[ph];
  let h='<div class="card"><b>Катастрофа</b><div>'+esc(V.disaster)+'</div></div>'+bunkerHtml(V.bunker);
  h+='<div class="card"><b>Раунд '+V.round+'</b> · '+label+' · мест в бункере: <b>'+V.spots+'</b>, в игре: '+V.players.filter(p=>p.st==="in").length;
  if(ph==="vote")h+=' · проголосовало: '+V.voted;
  if(me&&me.st==="spec")h+='<div class="mu">Вы наблюдаете: игра уже началась.</div>';
  h+='</div>';
  if(host){
    h+='<div class="row">';
    if(ph==="reveal")h+='<button type="button" data-act="tovote">К голосованию</button><button class="alt" type="button" data-act="skip">Пропустить голосование</button>';
    if(ph==="vote")h+='<button type="button" data-act="finish">Подвести итоги</button><button class="alt" type="button" data-act="skip">Пропустить, никого не изгонять</button>';
    if(ph==="over")h+='<button type="button" data-act="again">Новая игра</button>';
    h+='<button class="alt" type="button" data-act="restart">Начать заново (новые карточки)</button>';
    h+='</div>';
  }
  h+=spHtml();
  h+='<h2>Игроки</h2>';
  V.players.filter(p=>p.st!=="spec").forEach(p=>{
    const isMe=p.id===V.me,mine=V.myVote===p.id;
    h+='<div class="card'+(isMe?' me':'')+(p.st==="out"?' out':'')+'"><div class="hd"><b>'+esc(p.name)+(isMe?' (вы)':'')+'</b><span>'+
      (p.st==="out"?'<span class="badge bad">исключён</span>':ph==="over"?'<span class="badge ok">в бункере</span>':'<span class="badge">'+(p.off?'нет связи':'в игре')+'</span> <span class="badge">спец: '+p.sl+'</span>')+
      (ph==="vote"&&inGame&&p.st==="in"&&!isMe?' <button class="sm'+(mine?' on':'')+'" type="button" data-act="vote" data-id="'+esc(p.id)+'">'+(mine?'Ваш голос':'Голосовать')+'</button>':'')+
      '</span></div>'+rows(p)+'</div>';
  });
  h+='<h2>Ход игры</h2><ul>'+V.log.slice().reverse().map(l=>'<li>'+esc(l)+'</li>').join("")+'</ul>';
  m.innerHTML=h;
}
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");
  if(!b)return;
  const ac=b.dataset.act;
  if(ac==="spopen"){UI={slot:+b.dataset.id,key:"prof",target:""};render();return}
  if(ac==="spclose"){UI.slot=-1;render();return}
  if(ac==="spgo"){spGo();return}
  if(ac==="pick"){send("sppick",+b.dataset.id);return}
  if(ac==="pcancel"){send("spcancel");return}
  if(b.dataset.act==="restart"&&!confirm("Начать заново? Все получат новые карточки, бункер и катастрофу."))return;
  send(b.dataset.act,b.dataset.id);
});
$("#main").addEventListener("change",e=>{const u=e.target.dataset&&e.target.dataset.ui;if(u)UI[u]=e.target.value});
function nameVal(){
  const n=$("#nm").value.trim();
  if(!n){msg("Введите имя");return null}
  try{localStorage.setItem("bname",n)}catch(e){}
  msg("");return n;
}
$("#mk").addEventListener("click",()=>{const n=nameVal();if(n){if(typeof Peer==="undefined"){msg("Не загрузилась библиотека связи. Проверьте интернет.");return}createRoom(n);render()}});
$("#jn").addEventListener("click",()=>{
  const n=nameVal(),c=$("#cd").value.trim().toUpperCase();
  if(!n)return;
  if(c.length<5){msg("Введите код комнаты из 5 символов");return}
  if(typeof Peer==="undefined"){msg("Не загрузилась библиотека связи. Проверьте интернет.");return}
  joinRoom(n,c);render();
});
try{const n=localStorage.getItem("bname");if(n)$("#nm").value=n}catch(e){}
if(location.hash.length>1)$("#cd").value=location.hash.slice(1).toUpperCase().slice(0,5);
</script>
</body>
</html>
